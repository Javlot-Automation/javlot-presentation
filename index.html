<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    
    <!-- Web App / PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Javlot">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="application-name" content="Javlot">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-navbutton-color" content="#000000">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Optional: Add icon for home screen -->
    <!-- <link rel="apple-touch-icon" href="icon-180.png"> -->
    <!-- <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"> -->
    <title>Javlot — Service Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            scroll-behavior: smooth;
            /* Prevent zoom on mobile */
            touch-action: pan-x pan-y;
            -ms-touch-action: pan-x pan-y;
        }
        
        /* iOS Safari specific fixes */
        @supports (-webkit-touch-callout: none) {
            html, body {
                min-height: -webkit-fill-available;
            }
        }
        
        /* Prevent double-tap zoom on all elements */
        * {
            touch-action: manipulation;
        }
        
        /* ==========================================
           SCROLL TO START SECTION (mobile only)
        ========================================== */
        .scroll-intro {
            display: none;
            min-height: 200vh; /* Much taller to allow real scrolling */
            flex-direction: column;
            align-items: center;
            position: relative;
            background: linear-gradient(180deg, #0a0a0a 0%, #000 100%);
            padding-top: 30vh;
        }
        
        /* Show only on mobile landscape */
        @media (max-width: 932px) and (orientation: landscape) {
            .scroll-intro {
                display: flex;
            }
        }
        
        .scroll-intro-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeInUp 1s ease-out;
            position: sticky;
            top: 25vh;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .scroll-logo {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        
        .scroll-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        
        .scroll-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }
        
        .scroll-arrow {
            width: 24px;
            height: 24px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .scroll-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
        }
        
        /* Hide scroll intro in portrait mobile (rotate message shown instead) */
        @media (max-width: 900px) and (orientation: portrait) {
            .scroll-intro {
                display: none;
            }
        }
        
        /* ==========================================
           ADD TO HOME SCREEN PROMPT (mobile only)
        ========================================== */
        .install-prompt {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10000;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            animation: slideUp 0.4s ease-out;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .install-prompt.hidden {
            display: none !important;
        }
        
        .install-prompt-content {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .install-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .install-icon svg {
            width: 24px;
            height: 24px;
            color: #fff;
        }
        
        .install-text {
            flex: 1;
        }
        
        .install-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        
        .install-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.4;
        }
        
        .install-description .ios-steps {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        
        .install-description .ios-steps svg {
            width: 14px;
            height: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .install-close {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        
        .install-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .install-close svg {
            width: 16px;
            height: 16px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Platform-specific hints */
        .install-description .ios-hint,
        .install-description .android-hint {
            display: none;
            align-items: center;
            gap: 4px;
        }
        
        .install-description .ios-hint svg {
            width: 16px;
            height: 16px;
            color: rgba(255, 255, 255, 0.7);
            display: inline;
            vertical-align: middle;
        }
        
        /* Show on mobile only, when not in standalone mode */
        @media (max-width: 932px) {
            .install-prompt.show {
                display: block;
            }
        }
        
        /* Hide in standalone/fullscreen mode */
        @media (display-mode: standalone), (display-mode: fullscreen) {
            .install-prompt {
                display: none !important;
            }
            .scroll-intro {
                display: none !important;
            }
            .rotate-overlay {
                display: none !important;
            }
        }
        
        /* ==========================================
           ZOOM MAGNIFIER (mobile only)
        ========================================== */
        .magnifier {
            display: none;
            position: fixed;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9000;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.15s ease, transform 0.15s ease;
            
            /* Glass UI effect */
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 60px rgba(0, 0, 0, 0.4);
            
            overflow: hidden;
        }
        
        .magnifier.active {
            opacity: 1;
            transform: scale(1);
        }
        
        .magnifier-content {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 50%;
        }
        
        .magnifier-image {
            position: absolute;
            max-width: none;
            pointer-events: none;
        }
        
        .magnifier-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            pointer-events: none;
            opacity: 0.7;
        }
        
        .magnifier-crosshair::before,
        .magnifier-crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
        }
        
        .magnifier-crosshair::before {
            width: 1px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .magnifier-crosshair::after {
            height: 1px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .magnifier-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
        
        .magnifier-shine {
            position: absolute;
            top: 6%;
            left: 12%;
            width: 40%;
            height: 25%;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0) 100%
            );
            border-radius: 50%;
            pointer-events: none;
        }
        
        .magnifier-zoom-label {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 8px;
            pointer-events: none;
        }
        
        /* Only enable on mobile/tablet */
        @media (max-width: 1024px) and (hover: none) and (pointer: coarse) {
            .magnifier {
                display: block;
            }
        }
        
        /* ==========================================
           PRESENTATION SECTION (locked after scroll)
        ========================================== */
        .presentation-section {
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }
        
        /* When locked, prevent any scroll */
        html.locked,
        body.locked {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
        }
        
        body.locked .scroll-intro {
            display: none !important;
        }
        
        body.locked .presentation-section {
            position: fixed;
            inset: 0;
            height: 100%;
        }

        /* ==========================================
           ROTATE DEVICE OVERLAY
        ========================================== */
        .rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .rotate-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 32px;
            color: rgba(255, 255, 255, 0.9);
            animation: rotateHint 2s ease-in-out infinite;
        }

        @keyframes rotateHint {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(90deg); }
        }

        .rotate-title {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .rotate-text {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            max-width: 280px;
        }

        .rotate-hint {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .rotate-hint-icon {
            width: 20px;
            height: 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .rotate-hint-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Show overlay only on portrait mobile */
        @media (max-width: 900px) and (orientation: portrait) {
            .rotate-overlay {
                display: flex;
            }
            .presentation-container,
            .dynamic-background,
            .bg-overlay,
            .bg-noise,
            .progress-bar {
                display: none !important;
            }
        }

        /* ==========================================
           DYNAMIC BACKGROUND
        ========================================== */
        .dynamic-background {
            position: absolute;
            inset: -100px;
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: blur(80px) saturate(1.2);
            transform: scale(1.2);
        }

        .bg-image.active {
            opacity: 1;
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: 
                radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%),
                linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        .bg-noise {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.8) 0%, 
                rgba(255, 255, 255, 0.4) 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        /* ==========================================
           PRESENTATION CONTAINER
        ========================================== */
        .presentation-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 24px 24px 0 24px;
        }

        .slide-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        visibility 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 4px 24px rgba(0, 0, 0, 0.3),
                0 12px 48px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transition: box-shadow 0.3s ease;
        }

        .slide img:hover {
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.35),
                0 16px 64px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        }

        /* ==========================================
           NAVIGATION
        ========================================== */
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 0;
            flex-shrink: 0;
        }
        
        /* Mobile landscape - make slide-wrapper take full height */
        @media (max-width: 932px) and (orientation: landscape) {
            .presentation-container {
                padding-bottom: 0;
            }
            
            .slide-wrapper {
                flex: 1;
                height: 100%;
            }
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: rgba(255, 255, 255, 0.5);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
        }

        .slide-indicators {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .indicator:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: scale(1.2);
        }

        .indicator.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        /* ==========================================
           RESPONSIVE - LANDSCAPE MOBILE & TABLET
        ========================================== */
        
        /* Mobile landscape - navigation overlay */
        @media (max-width: 932px) and (orientation: landscape) {
            .presentation-container {
                padding: 8px 12px 0 12px;
            }
            
            .slide-wrapper {
                position: relative;
                height: 100%;
            }
            
            .nav-container {
                position: absolute;
                bottom: 12px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 50;
                gap: 12px;
                padding: 10px 0;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-radius: 40px;
                padding: 8px 16px;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }

            .nav-btn {
                width: 36px;
                height: 36px;
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.15);
            }
            
            .nav-btn:active:not(:disabled) {
                background: rgba(255, 255, 255, 0.25);
            }
            
            .nav-btn svg {
                width: 16px;
                height: 16px;
            }

            .slide-indicators {
                padding: 5px 10px;
                gap: 5px;
                background: transparent;
                border: none;
            }

            .indicator {
                width: 5px;
                height: 5px;
            }

            .indicator.active {
                width: 16px;
                border-radius: 3px;
            }

            .slide img {
                border-radius: 8px;
                max-height: calc(100% - 20px);
            }

            .bg-image {
                filter: blur(60px) saturate(1.1);
            }
        }
        
        /* Extra small landscape (very short screens like iPhone SE landscape) */
        @media (max-height: 400px) and (orientation: landscape) {
            .presentation-container {
                padding: 4px 8px 0 8px;
            }
            
            .nav-container {
                bottom: 8px;
                padding: 6px 12px;
                gap: 8px;
            }
            
            .nav-btn {
                width: 30px;
                height: 30px;
            }
            
            .nav-btn svg {
                width: 14px;
                height: 14px;
            }
            
            .slide-indicators {
                padding: 4px 8px;
                gap: 4px;
            }
            
            .indicator {
                width: 4px;
                height: 4px;
            }
            
            .indicator.active {
                width: 12px;
            }
            
            .slide img {
                border-radius: 6px;
            }
        }

        /* Tablet landscape - keep normal layout */
        @media (min-width: 933px) and (max-width: 1024px) and (orientation: landscape) {
            .presentation-container {
                padding: 16px 20px 0 20px;
            }
            
            .nav-container {
                padding: 16px 0;
            }
        }
        
        @media (max-height: 500px) and (min-width: 933px) {
            .presentation-container {
                padding: 12px 16px 0 16px;
            }
            
            .nav-container {
                padding: 12px 0;
                gap: 16px;
            }
            
            .nav-btn {
                width: 40px;
                height: 40px;
            }
            
            .nav-btn svg {
                width: 18px;
                height: 18px;
            }
            
            .slide-indicators {
                padding: 6px 12px;
                gap: 6px;
            }
            
            .indicator {
                width: 6px;
                height: 6px;
            }
            
            .indicator.active {
                width: 18px;
            }
            
            .slide img {
                border-radius: 10px;
            }
        }

        /* Safe area for notched devices */
        @supports (padding: max(0px)) {
            .presentation-container {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            @media (max-width: 768px) and (orientation: landscape) {
                .presentation-container {
                    padding-left: max(12px, env(safe-area-inset-left));
                    padding-right: max(12px, env(safe-area-inset-right));
                }
            }
        }
    </style>
</head>
<body>
    <!-- Install Prompt (mobile only) -->
    <div class="install-prompt" id="installPrompt">
        <div class="install-prompt-content">
            <div class="install-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12l7 7 7-7"/>
                </svg>
            </div>
            <div class="install-text">
                <div class="install-title">For a better experience</div>
                <div class="install-description">
                    <span class="ios-hint">Tap <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> then "Add to Home Screen"</span>
                    <span class="android-hint">Tap menu then "Add to Home Screen"</span>
                </div>
            </div>
            <button class="install-close" id="installClose" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Zoom Magnifier (mobile only) -->
    <div class="magnifier" id="magnifier">
        <div class="magnifier-content">
            <img class="magnifier-image" id="magnifierImage" src="" alt="">
        </div>
        <div class="magnifier-crosshair"></div>
        <div class="magnifier-ring"></div>
        <div class="magnifier-shine"></div>
        <span class="magnifier-zoom-label">2×</span>
    </div>

    <!-- Rotate Device Overlay -->
    <div class="rotate-overlay" id="rotateOverlay">
        <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12" y2="18.01" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h2 class="rotate-title">Rotate Your Device</h2>
        <p class="rotate-text">Please rotate your phone to landscape mode for the best viewing experience.</p>
        <div class="rotate-hint">
            <svg class="rotate-hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 4v6h6"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
            <span class="rotate-hint-text">Turn 90°</span>
        </div>
    </div>

    <!-- Scroll Intro Section -->
    <section class="scroll-intro" id="scrollIntro">
        <div class="scroll-intro-content">
            <div class="scroll-logo">JAVLOT</div>
            <p class="scroll-text">Service Presentation</p>
            <div class="scroll-indicator">
                <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M19 12l-7 7-7-7"/>
                </svg>
                <span class="scroll-hint">Scroll down</span>
            </div>
        </div>
    </section>

    <!-- Presentation Section -->
    <section class="presentation-section" id="presentationSection">
        <!-- Dynamic Blurred Background -->
        <div class="dynamic-background" id="dynamicBg"></div>
        <div class="bg-overlay"></div>
        <div class="bg-noise"></div>

        <!-- Progress Bar -->
        <div class="progress-bar" id="progressBar"></div>

        <!-- Main Container -->
        <div class="presentation-container">
        <div class="slide-wrapper" id="slideWrapper">
            <div class="slide active" data-slide="0">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448674b3e667cec0238eee_Slide-1.png" alt="Slide 1">
            </div>
            <div class="slide" data-slide="1">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675ddd9ecac5e14a1e1_Slide-2.png" alt="Slide 2">
            </div>
            <div class="slide" data-slide="2">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675ccc88f5c9f57ec22_Slide-3.png" alt="Slide 3">
            </div>
            <div class="slide" data-slide="3">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675f4f09e0367763add_Slide-4.png" alt="Slide 4">
            </div>
            <div class="slide" data-slide="4">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/6944867597fec9ece7421370_Slide-5.png" alt="Slide 5">
            </div>
            <div class="slide" data-slide="5">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/6944867570023b65ec37490e_0a9fa58e3653f90e2d29612d8aac8742_Slide-6.png" alt="Slide 6">
            </div>
            <div class="slide" data-slide="6">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448677af972b69a676eca0_Slide-7.png" alt="Slide 7">
            </div>
            <div class="slide" data-slide="7">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448677c9a3312cb0b77e21_Slide-8.png" alt="Slide 8">
            </div>
            <div class="slide" data-slide="8">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675d7249a7c984e5822_Slide-9.png" alt="Slide 9">
            </div>
            <div class="slide" data-slide="9">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448674b1aa5033c407ad18_Slide-10.png" alt="Slide 10">
            </div>
        </div>

        <div class="nav-container">
            <button class="nav-btn" id="prevBtn" aria-label="Previous slide">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="slide-indicators" id="indicators"></div>

            <button class="nav-btn" id="nextBtn" aria-label="Next slide">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </section>

    <script>
        const slides = document.querySelectorAll('.slide');
        const indicators = document.getElementById('indicators');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const slideWrapper = document.getElementById('slideWrapper');
        const dynamicBg = document.getElementById('dynamicBg');
        const scrollIntro = document.getElementById('scrollIntro');
        const presentationSection = document.getElementById('presentationSection');

        let currentIndex = 0;
        const totalSlides = slides.length;
        let isLocked = false;

        // Get all slide image URLs
        const slideImages = Array.from(slides).map(slide => {
            const img = slide.querySelector('img');
            return img ? img.src : '';
        });

        // Create background images for each slide
        slideImages.forEach((src, index) => {
            const bgImg = document.createElement('div');
            bgImg.className = 'bg-image' + (index === 0 ? ' active' : '');
            bgImg.style.backgroundImage = `url(${src})`;
            dynamicBg.appendChild(bgImg);
        });

        const bgImages = document.querySelectorAll('.bg-image');

        // Create indicators
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'indicator' + (i === 0 ? ' active' : '');
            dot.addEventListener('click', function() { goToSlide(i); });
            indicators.appendChild(dot);
        }

        function updateSlide() {
            slides.forEach(function(slide, index) {
                slide.classList.toggle('active', index === currentIndex);
            });

            bgImages.forEach(function(bg, index) {
                bg.classList.toggle('active', index === currentIndex);
            });

            document.querySelectorAll('.indicator').forEach(function(dot, index) {
                dot.classList.toggle('active', index === currentIndex);
            });

            progressBar.style.width = ((currentIndex + 1) / totalSlides * 100) + '%';

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalSlides - 1;
        }

        function goToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                currentIndex = index;
                updateSlide();
            }
        }

        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                currentIndex++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }

        // Lock the presentation after scrolling
        function lockPresentation() {
            if (isLocked) return;
            isLocked = true;
            
            // Scroll to top first
            window.scrollTo(0, 0);
            
            // Then lock
            document.body.classList.add('locked');
            document.documentElement.classList.add('locked');
            
            // Prevent any scroll attempts
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.top = '0';
            document.body.style.left = '0';
            document.body.style.right = '0';
            document.body.style.bottom = '0';
            document.documentElement.style.overflow = 'hidden';
        }

        // Scroll detection
        function handleScroll() {
            if (isLocked) return;
            if (!isMobileLandscape()) {
                lockPresentation();
                return;
            }
            
            const scrollY = window.scrollY || window.pageYOffset;
            const triggerPoint = window.innerHeight * 0.8; // Lock after scrolling 80% of viewport
            
            if (scrollY > triggerPoint) {
                lockPresentation();
            }
        }

        // Scroll to presentation on click/tap of intro
        scrollIntro.addEventListener('click', function() {
            window.scrollTo({
                top: window.innerHeight * 0.85,
                behavior: 'smooth'
            });
            setTimeout(lockPresentation, 600);
        });

        // Listen for scroll
        window.addEventListener('scroll', handleScroll, { passive: true });

        // Button clicks
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!isLocked) {
                if (e.key === 'ArrowDown' || e.key === ' ') {
                    e.preventDefault();
                    presentationSection.scrollIntoView({ behavior: 'smooth' });
                    setTimeout(lockPresentation, 500);
                }
                return;
            }
            
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                e.preventDefault();
                goToSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                goToSlide(totalSlides - 1);
            }
        });

        // Touch swipe on presentation
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        slideWrapper.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        slideWrapper.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;
            
            // Only handle horizontal swipes
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX > 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            }
        }, { passive: true });

        // Preload images for smoother background transitions
        slideImages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        // Init
        updateSlide();
        
        // Check if mobile landscape (needs scroll intro)
        function isMobileLandscape() {
            return window.innerWidth <= 932 && window.innerWidth > window.innerHeight;
        }
        
        // Check if already scrolled (page refresh) - only on mobile
        if (isMobileLandscape() && window.scrollY > window.innerHeight * 0.8) {
            lockPresentation();
        }
        
        // On desktop, lock immediately
        if (!isMobileLandscape()) {
            lockPresentation();
        }
        
        // Handle orientation/resize changes
        window.addEventListener('resize', function() {
            if (!isMobileLandscape() && !isLocked) {
                lockPresentation();
            }
        });
        
        // Prevent zoom on mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Prevent double-tap zoom
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(e) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, { passive: false });
            
            // Prevent pinch zoom
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent gesture zoom (iOS)
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
            }, { passive: false });
        }
        
        // Install prompt logic
        (function() {
            const installPrompt = document.getElementById('installPrompt');
            const installClose = document.getElementById('installClose');
            
            // Check if already in standalone mode
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
                || window.navigator.standalone === true
                || document.referrer.includes('android-app://');
            
            // Check if mobile
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            // Check if already dismissed
            const isDismissed = localStorage.getItem('installPromptDismissed');
            
            if (isMobile && !isStandalone && !isDismissed) {
                // Show after a short delay
                setTimeout(function() {
                    installPrompt.classList.add('show');
                    
                    // Show platform-specific hint
                    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
                    if (isIOS) {
                        document.querySelector('.ios-hint').style.display = 'inline-flex';
                    } else {
                        document.querySelector('.android-hint').style.display = 'inline-flex';
                    }
                }, 2000);
            }
            
            // Close button
            installClose.addEventListener('click', function() {
                installPrompt.classList.remove('show');
                installPrompt.classList.add('hidden');
                localStorage.setItem('installPromptDismissed', 'true');
            });
        })();
        
        // Magnifier logic (mobile only)
        (function() {
            const magnifier = document.getElementById('magnifier');
            const magnifierImage = document.getElementById('magnifierImage');
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            if (!isTouchDevice) return;
            
            const ZOOM_LEVEL = 2;
            const MAGNIFIER_SIZE = 160;
            const OFFSET_Y = -100; // Position above finger
            
            let isActive = false;
            let currentImg = null;
            let holdTimeout = null;
            
            function getActiveSlideImage() {
                const activeSlide = document.querySelector('.slide.active img');
                return activeSlide;
            }
            
            function showMagnifier(touch) {
                currentImg = getActiveSlideImage();
                if (!currentImg) return;
                
                // Set the magnifier image source
                magnifierImage.src = currentImg.src;
                
                // Get image dimensions and position
                const imgRect = currentImg.getBoundingClientRect();
                
                // Calculate scaled dimensions
                const scaledWidth = imgRect.width * ZOOM_LEVEL;
                const scaledHeight = imgRect.height * ZOOM_LEVEL;
                
                magnifierImage.style.width = scaledWidth + 'px';
                magnifierImage.style.height = scaledHeight + 'px';
                
                isActive = true;
                magnifier.classList.add('active');
                
                updateMagnifier(touch);
            }
            
            function updateMagnifier(touch) {
                if (!isActive || !currentImg) return;
                
                const imgRect = currentImg.getBoundingClientRect();
                const touchX = touch.clientX;
                const touchY = touch.clientY;
                
                // Check if touch is within image bounds
                if (touchX < imgRect.left || touchX > imgRect.right ||
                    touchY < imgRect.top || touchY > imgRect.bottom) {
                    hideMagnifier();
                    return;
                }
                
                // Position magnifier above finger
                let magX = touchX - MAGNIFIER_SIZE / 2;
                let magY = touchY + OFFSET_Y - MAGNIFIER_SIZE / 2;
                
                // Keep magnifier within viewport
                const padding = 10;
                magX = Math.max(padding, Math.min(window.innerWidth - MAGNIFIER_SIZE - padding, magX));
                magY = Math.max(padding, Math.min(window.innerHeight - MAGNIFIER_SIZE - padding, magY));
                
                magnifier.style.left = magX + 'px';
                magnifier.style.top = magY + 'px';
                
                // Calculate position within image (0-1)
                const relX = (touchX - imgRect.left) / imgRect.width;
                const relY = (touchY - imgRect.top) / imgRect.height;
                
                // Calculate image offset within magnifier
                const scaledWidth = imgRect.width * ZOOM_LEVEL;
                const scaledHeight = imgRect.height * ZOOM_LEVEL;
                
                const offsetX = -(relX * scaledWidth) + MAGNIFIER_SIZE / 2;
                const offsetY = -(relY * scaledHeight) + MAGNIFIER_SIZE / 2;
                
                magnifierImage.style.left = offsetX + 'px';
                magnifierImage.style.top = offsetY + 'px';
            }
            
            function hideMagnifier() {
                isActive = false;
                magnifier.classList.remove('active');
                currentImg = null;
                if (holdTimeout) {
                    clearTimeout(holdTimeout);
                    holdTimeout = null;
                }
            }
            
            // Touch events on slide wrapper
            slideWrapper.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                
                const touch = e.touches[0];
                const img = getActiveSlideImage();
                if (!img) return;
                
                const imgRect = img.getBoundingClientRect();
                
                // Check if touch is on the image
                if (touch.clientX >= imgRect.left && touch.clientX <= imgRect.right &&
                    touch.clientY >= imgRect.top && touch.clientY <= imgRect.bottom) {
                    
                    // Small delay to differentiate from swipe
                    holdTimeout = setTimeout(function() {
                        showMagnifier(touch);
                    }, 150);
                }
            }, { passive: true });
            
            slideWrapper.addEventListener('touchmove', function(e) {
                if (!isActive && holdTimeout) {
                    // Cancel if moving before hold threshold
                    clearTimeout(holdTimeout);
                    holdTimeout = null;
                    return;
                }
                
                if (isActive && e.touches.length === 1) {
                    updateMagnifier(e.touches[0]);
                }
            }, { passive: true });
            
            slideWrapper.addEventListener('touchend', function() {
                hideMagnifier();
            }, { passive: true });
            
            slideWrapper.addEventListener('touchcancel', function() {
                hideMagnifier();
            }, { passive: true });
        })();
    </script>
</body>
