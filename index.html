<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javlot — Service Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
        }

        /* ==========================================
           DYNAMIC BACKGROUND
        ========================================== */
        .dynamic-background {
            position: fixed;
            inset: -100px; /* Extend beyond viewport to avoid blur edges */
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: blur(80px) saturate(1.2);
            transform: scale(1.2);
        }

        .bg-image.active {
            opacity: 1;
        }

        /* Dark overlay on the blurred background */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: 
                radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%),
                linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        /* Subtle noise texture */
        .bg-noise {
            position: fixed;
            inset: 0;
            z-index: 2;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* ==========================================
           PRESENTATION CONTAINER
        ========================================== */
        .presentation-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 24px 0 24px;
        }

        .slide-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        visibility 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 4px 24px rgba(0, 0, 0, 0.3),
                0 12px 48px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transition: box-shadow 0.3s ease;
        }

        .slide img:hover {
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.35),
                0 16px 64px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        }

        /* ==========================================
           NAVIGATION
        ========================================== */
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: rgba(255, 255, 255, 0.5);
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
        }

        .slide-indicators {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .indicator:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: scale(1.2);
        }

        .indicator.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        /* ==========================================
           PROGRESS BAR
        ========================================== */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0.8) 0%, 
                rgba(255, 255, 255, 0.4) 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */
        @media (max-width: 768px) {
            .presentation-container {
                padding: 16px 16px 0 16px;
            }

            .nav-container {
                gap: 12px;
                padding: 16px 0;
            }

            .nav-btn {
                width: 44px;
                height: 44px;
            }

            .slide-indicators {
                padding: 6px 12px;
            }

            .indicator {
                width: 6px;
                height: 6px;
            }

            .indicator.active {
                width: 18px;
            }

            .slide img {
                border-radius: 12px;
            }

            .bg-image {
                filter: blur(60px) saturate(1.1);
            }
        }

        @media (max-width: 480px) {
            .slide img {
                border-radius: 8px;
            }

            .nav-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Dynamic Blurred Background -->
    <div class="dynamic-background" id="dynamicBg"></div>
    <div class="bg-overlay"></div>
    <div class="bg-noise"></div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Main Container -->
    <div class="presentation-container">
        <div class="slide-wrapper" id="slideWrapper">
            <div class="slide active" data-slide="0">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448674b3e667cec0238eee_Slide-1.png" alt="Slide 1">
            </div>
            <div class="slide" data-slide="1">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675ddd9ecac5e14a1e1_Slide-2.png" alt="Slide 2">
            </div>
            <div class="slide" data-slide="2">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675ccc88f5c9f57ec22_Slide-3.png" alt="Slide 3">
            </div>
            <div class="slide" data-slide="3">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675f4f09e0367763add_Slide-4.png" alt="Slide 4">
            </div>
            <div class="slide" data-slide="4">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/6944867597fec9ece7421370_Slide-5.png" alt="Slide 5">
            </div>
            <div class="slide" data-slide="5">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/6944867570023b65ec37490e_Slide-6.png" alt="Slide 6">
            </div>
            <div class="slide" data-slide="6">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448677af972b69a676eca0_Slide-7.png" alt="Slide 7">
            </div>
            <div class="slide" data-slide="7">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448677c9a3312cb0b77e21_Slide-8.png" alt="Slide 8">
            </div>
            <div class="slide" data-slide="8">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448675d7249a7c984e5822_Slide-9.png" alt="Slide 9">
            </div>
            <div class="slide" data-slide="9">
                <img src="https://cdn.prod.website-files.com/6922ec1acf460de83ba1b177/69448674b1aa5033c407ad18_Slide-10.png" alt="Slide 10">
            </div>
        </div>

        <div class="nav-container">
            <button class="nav-btn" id="prevBtn" aria-label="Slide précédente">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="slide-indicators" id="indicators"></div>

            <button class="nav-btn" id="nextBtn" aria-label="Slide suivante">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const indicators = document.getElementById('indicators');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const slideWrapper = document.getElementById('slideWrapper');
        const dynamicBg = document.getElementById('dynamicBg');

        let currentIndex = 0;
        const totalSlides = slides.length;

        // Get all slide image URLs
        const slideImages = Array.from(slides).map(slide => {
            const img = slide.querySelector('img');
            return img ? img.src : '';
        });

        // Create background images for each slide
        slideImages.forEach((src, index) => {
            const bgImg = document.createElement('div');
            bgImg.className = 'bg-image' + (index === 0 ? ' active' : '');
            bgImg.style.backgroundImage = `url(${src})`;
            dynamicBg.appendChild(bgImg);
        });

        const bgImages = document.querySelectorAll('.bg-image');

        // Create indicators
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'indicator' + (i === 0 ? ' active' : '');
            dot.addEventListener('click', function() { goToSlide(i); });
            indicators.appendChild(dot);
        }

        function updateSlide() {
            // Update slides
            slides.forEach(function(slide, index) {
                slide.classList.toggle('active', index === currentIndex);
            });

            // Update background images
            bgImages.forEach(function(bg, index) {
                bg.classList.toggle('active', index === currentIndex);
            });

            // Update indicators
            document.querySelectorAll('.indicator').forEach(function(dot, index) {
                dot.classList.toggle('active', index === currentIndex);
            });

            // Update progress bar
            progressBar.style.width = ((currentIndex + 1) / totalSlides * 100) + '%';

            // Update button states
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalSlides - 1;
        }

        function goToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                currentIndex = index;
                updateSlide();
            }
        }

        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                currentIndex++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }

        // Button clicks
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                e.preventDefault();
                goToSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                goToSlide(totalSlides - 1);
            }
        });

        // Touch swipe
        let touchStartX = 0;
        let touchEndX = 0;

        slideWrapper.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        slideWrapper.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            }
        }, { passive: true });

        // Preload images for smoother background transitions
        slideImages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        // Init
        updateSlide();
    </script>
</body>
</html>
